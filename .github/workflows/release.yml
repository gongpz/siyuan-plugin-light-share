name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package plugin
        run: |
          rm -rf dist
          mkdir -p dist
          cp plugin.json index.js index.css icon.png preview.png README.md LICENSE dist/
          cp -r i18n dist/
          cd dist
          zip -r ../package.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          generate_release_notes: true
