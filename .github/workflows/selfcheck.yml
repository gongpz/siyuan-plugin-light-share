name: Self check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test deps
        run: npm install jsdom jsqr --no-save

      - name: Self check
        run: node tools/selfcheck.js

      - name: Runtime verify
        run: node tools/runtime-verify.js
